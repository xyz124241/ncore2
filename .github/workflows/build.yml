name: Build NeptunCore

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the single NeptunCore plugin
        run: mvn --batch-mode --no-transfer-progress --errors clean verify

      - name: Upload NeptunCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: NeptunCore
          path: target/NeptunCore-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/NeptunCore-*.jar
